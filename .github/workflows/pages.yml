name: PIQPAQPOQ Website Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - PIQPAQPOQ RSS Collector
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: piqpaqpoq-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest site and RSS data
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify website files and prepare public directory
        run: |
          test -f index.html
          test -f assets/js/app.js
          test -f assets/js/ppq_analytics_events.js
          test -f data/rss-news.json
          test -f scripts/build_seo.py
          test -f data/seo-products-2026w3.json
          mkdir -p public/assets public/data
          cp index.html public/index.html
          python - <<'PY'
          from pathlib import Path
          page = Path('public/index.html')
          source = page.read_text(encoding='utf-8')
          measurement_id = 'G-4Q7P01BEHT'
          marker = f'https://www.googletagmanager.com/gtag/js?id={measurement_id}'
          if marker not in source:
              if '<head>' not in source:
                  raise RuntimeError('HTML <head> not found; GA4 tag was not installed')
              tag = (
                  '\n<!-- Google Analytics GA4 -->\n'
                  f'<script async src="{marker}"></script>\n'
                  '<script>\n'
                  '  window.dataLayer = window.dataLayer || [];\n'
                  '  function gtag(){dataLayer.push(arguments);}\n'
                  "  gtag('js', new Date());\n"
                  f"  gtag('config', '{measurement_id}');\n"
                  '</script>\n'
              )
              source = source.replace('<head>', '<head>' + tag, 1)
          event_script = '<script defer src="assets/js/ppq_analytics_events.js"></script>'
          if event_script not in source:
              source = source.replace('</head>', event_script + '\n</head>', 1)
          page.write_text(source, encoding='utf-8')
          if marker not in source or event_script not in source:
              raise RuntimeError('GA4 tag / custom event script verification failed')
          print('GA4 and outbound click tracking installed')
          PY
          cp -R assets/. public/assets/
          cp data/rss-news.json public/data/rss-news.json
          python -m json.tool public/data/rss-news.json > /dev/null
      - name: Build SEO-friendly pages and sitemap
        run: python scripts/build_seo.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
