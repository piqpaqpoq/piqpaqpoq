name: PIQPAQPOQ RSS Collector

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 테스트만 / collect = 실제 수집 및 저장"
        required: true
        type: choice
        default: check
        options:
          - check
          - collect
  # 무료 사용량 및 과금 차단 설정을 확인한 뒤 아래 주석을 해제하세요.
  # 한국시간 매일 07:00 / 13:00 / 19:00 = UTC 22:00 / 04:00 / 10:00
  # schedule:
  #   - cron: '0 22,4,10 * * *'

permissions:
  contents: write

concurrency:
  group: piqpaqpoq-rss
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s automation -p 'test_*.py' -v
      - name: Validate feed configuration
        run: python automation/collect_rss.py --check
      - name: Collect headlines
        if: github.event_name == 'schedule' || inputs.mode == 'collect'
        run: python automation/collect_rss.py
      - name: Commit updated feed JSON
        if: github.event_name == 'schedule' || inputs.mode == 'collect'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rss-news.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'data: update RSS headlines'
            git push
          fi

